
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - PhotoBored</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/feed" class="logo">PhotoBored</a>
            <div class="nav-links">
                <a href="/photo">Upload</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>

        <div class="feed-container" id="feed-container">
            <!-- Feed items will be dynamically inserted here -->
        </div>

        <div class="loading-spinner" id="loading-spinner">
            <p>Loading...</p>
        </div>
        <div class="intersection-observer" id="intersection-observer"></div>
    </div>

    <script>
        let page = 1;
        let loading = false;
        let hasMore = true;

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !loading && hasMore) {
                loadMorePosts();
            }
        }, { threshold: 0.1 });

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/login_page';
                return;
            }

            loadInitialPosts();
            observer.observe(document.getElementById('intersection-observer'));
            setupWebSocket();
        });

        document.getElementById('logout-btn').addEventListener('click', logout);

        function setupWebSocket() {
            const ws = new WebSocket(`ws://${window.location.host}/ws/feed`);
            
            ws.onmessage = (event) => {
                const newPost = JSON.parse(event.data);
                prependPost(newPost);
            };

            ws.onclose = () => {
                setTimeout(setupWebSocket, 3000);
            };
        }

        async function loadInitialPosts() {
            page = 1;
            const posts = await fetchPosts(page);
            document.getElementById('feed-container').innerHTML = '';
            posts.forEach(post => appendPost(post));
        }

        async function loadMorePosts() {
            if (loading || !hasMore) return;
            
            loading = true;
            document.getElementById('loading-spinner').style.display = 'block';
            
            const posts = await fetchPosts(++page);
            posts.forEach(post => appendPost(post));
            
            loading = false;
            document.getElementById('loading-spinner').style.display = 'none';
            
            if (posts.length < 10) {
                hasMore = false;
            }
        }

        async function fetchPosts(page) {
            const token = localStorage.getItem('accessToken');
            try {
                const response = await fetch(`/api/feed?page=${page}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.status === 401) {
                    window.location.href = '/login_page';
                    return [];
                }
                
                return await response.json();
            } catch (error) {
                console.error('Error fetching posts:', error);
                return [];
            }
        }

        function appendPost(post) {
            const postElement = createPostElement(post);
            document.getElementById('feed-container').appendChild(postElement);
        }

        function prependPost(post) {
            const postElement = createPostElement(post);
            document.getElementById('feed-container').prepend(postElement);
        }

        function createPostElement(post) {
            const div = document.createElement('div');
            div.className = 'feed-item';
            div.innerHTML = `
                <img src="/serveimage/${post.filename}" alt="Post">
                <div class="feed-item-content">
                    <h3>${post.username || 'Unknown User'}</h3>
                    <p>${post.caption || ''}</p>
                </div>
            `;
            return div;
        }

        function logout() {
            localStorage.removeItem('accessToken');
            window.location.href = '/login_page';
        }
    </script>
</body>
</html>
