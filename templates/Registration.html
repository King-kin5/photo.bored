
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PhotoBored</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form">
            <h1>PhotoBored</h1>
            <form id="registrationForm">
                <input type="text" id="username" name="username" placeholder="Username" required>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
            <div id="registration-result"></div>
            <p>Already have an account? <a href="/login_page">Log in</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.status === 201) {
                    if (data.tokens) {
                        localStorage.setItem('accessToken', data.tokens.access_token);
                        localStorage.setItem('refreshToken', data.tokens.refresh_token);
                    }
                    window.location.href = '/feed';
                } else {
                    document.getElementById('registration-result').innerHTML = data.message || "Registration failed. Please try again.";
                }
            } catch (error) {
                console.error('Registration error:', error);
                document.getElementById('registration-result').innerHTML = "An error occurred. Please try again.";
            }
        });
    </script>
</body>
</html>
