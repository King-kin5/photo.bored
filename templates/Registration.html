<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoBoard - Registration</title>
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
    <!-- Previous styles remain the same -->
    <style>
        /* Keep existing styles */
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-emoji">📸</div>
        <h1 class="title">PhotoBoard</h1>
        <h2 class="subtitle">Create your account</h2>
        <form id="registrationForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Join the Community</button>
        </form>
        <div id="registration-result"></div>
        <div class="login-link">
            Already a member? <a href="/login_page">Log in</a>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.status === 201) {
                    document.getElementById('registration-result').innerHTML = "Registration successful! Redirecting to feed...";
                    
                    // Store the tokens just like in login
                    if (data.tokens) {
                        localStorage.setItem('accessToken', data.tokens.access_token);
                        localStorage.setItem('refreshToken', data.tokens.refresh_token);
                    }

                    // Redirect to feed page
                    setTimeout(() => {
                        window.location.href = '/feed';
                    }, 1000);
                } else {
                    document.getElementById('registration-result').innerHTML = data.message || "Registration failed. Please try again.";
                }
            } catch (error) {
                console.error('Registration error:', error);
                document.getElementById('registration-result').innerHTML = "An error occurred. Please try again.";
            }
        });
    </script>
</body>
</html>
