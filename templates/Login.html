<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoBoard - Login</title>
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
    <style>
        /* Previous CSS styles remain the same */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            width: 360px;
        }
        .title {
            color: #ad1457;
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }
        .camera-emoji {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 16px;
            color: #ad1457;
            margin-bottom: 6px;
        }
        input {
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #f48fb1;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #ad1457;
        }
        button {
            background-color: #ad1457;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #880e4f;
        }
        #login-result {
            margin-top: 20px;
            text-align: center;
            color: #ad1457;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
        }
        .register-link a {
            color: #ad1457;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-emoji">📸</div>
        <h1 class="title">PhotoBoard</h1>
        <h2 class="subtitle">Log in to your account</h2>
        <form id="loginForm">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Log in</button>
        </form>
        <div id="login-result"></div>
        <div class="register-link">
            New here? <a href="/registration">Create an account</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store tokens in localStorage
                    localStorage.setItem('accessToken', data.tokens.access_token);
                    localStorage.setItem('refreshToken', data.tokens.refresh_token);
                    
                    document.getElementById('login-result').innerHTML = "Login successful!";
                    // Redirect to feed page after successful login
                    window.location.href = '/feed';
                } else {
                    document.getElementById('login-result').innerHTML = data.message || "Login failed";
                }
            } catch (error) {
                document.getElementById('login-result').innerHTML = "An error occurred. Please try again.";
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
