<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Images - PhotoBoard</title>
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
    <style>
        /* Previous CSS styles remain the same */
        /* ... (keep all existing styles) ... */
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 10px;">Upload Images</h2>
        
        <div class="upload-icon" id="file-upload-icon" onmouseover="showTooltip('Select Images')" onmouseout="hideTooltip()">
            +
            <span class="tooltip" id="tooltip-text">Select Images</span>
        </div>
        <input type="file" id="file-upload" class="file-input" accept="image/*" multiple onchange="handleFileSelect(this)">

        <div id="preview-container" class="image-grid">
            <!-- Image previews will be shown here -->
        </div>

        <button type="submit" class="upload-icon" onclick="uploadImages()" onmouseover="showTooltip('Upload Images')" onmouseout="hideTooltip()">
            ⬆
            <span class="tooltip" id="tooltip-text-upload">Upload Images</span>
        </button>

        <div class="upload-progress">
            <div class="progress-bar"></div>
        </div>

        <div id="upload-error" class="error-message"></div>
    </div>

    <script>
        // Check for authentication on page load
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/login_page';
            }
        });

        let selectedFiles = [];

        function showTooltip(message) {
            const tooltip = document.getElementById('tooltip-text');
            tooltip.textContent = message;
            tooltip.classList.add('show');
        }

        function hideTooltip() {
            document.getElementById('tooltip-text').classList.remove('show');
        }

        function handleFileSelect(input) {
            if (input.files) {
                for (let file of input.files) {
                    if (file.type.startsWith('image/')) {
                        selectedFiles.push(file);
                        displayPreview(file);
                    }
                }
            }
        }

        function displayPreview(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const previewDiv = document.createElement('div');
                previewDiv.className = 'preview-group';
                previewDiv.innerHTML = `
                    <img src="${e.target.result}" class="preview-image" alt="Preview">
                    <button type="button" class="remove-preview" onclick="removePreview(this, '${file.name}')">×</button>
                `;
                document.getElementById('preview-container').appendChild(previewDiv);
            }
            reader.readAsDataURL(file);
        }

        function removePreview(button, fileName) {
            button.parentElement.remove();
            selectedFiles = selectedFiles.filter(file => file.name !== fileName);
        }

        async function uploadImages() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/login_page';
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach(file => formData.append('images[]', file));

            const progressContainer = document.querySelector('.upload-progress');
            const progressBar = document.querySelector('.progress-bar');
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.ok) {
                    document.getElementById('preview-container').innerHTML = '';
                    selectedFiles = [];
                    progressContainer.style.display = 'none';
                    alert('Images uploaded successfully!');
                } else if (response.status === 401) {
                    // Token expired or invalid
                    localStorage.removeItem('accessToken');
                    window.location.href = '/login_page';
                } else {
                    throw new Error('Upload failed');
                }
            } catch (error) {
                document.getElementById('upload-error').textContent = 'Failed to upload images. Please try again.';
                progressContainer.style.display = 'none';
            }

            progressBar.style.width = '100%';
        }
    </script>
</body>
</html>
