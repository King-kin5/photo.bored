<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - PhotoBored</title>
    <link rel="stylesheet" href="/static/main.css">
    <link rel="stylesheet" href="/static/photo.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/feed" class="logo">PhotoBored</a>
            <div class="nav-links">
                <a href="/feed">Feed</a>
                <a href="#" id="logout-btn">Logout</a>
            </div>
        </div>

        <div class="upload-container">
            <div class="upload-area" id="upload-area">
                <p>Drag & drop images here, or click to select files</p>
                <input type="file" id="file-upload" multiple accept="image/*" class="hidden">
            </div>
            <div class="preview-container" id="preview-container"></div>
            <button id="upload-button">Upload</button>
        </div>
    </div>

    <script src="/static/photo.js"></script>
</body>
</html>
